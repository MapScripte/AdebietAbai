<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Абай ілімі — Көңілді сергіту сәті</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .serif-title { font-family: 'Playfair Display', serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce-slow { animation: bounce-slow 2.5s ease-in-out infinite; }
    </style>
</head>
<body class="bg-gradient-to-br from-violet-600 via-fuchsia-600 to-rose-600 min-h-screen text-slate-900 selection:bg-amber-400 pb-16 flex flex-col justify-between">

    <!-- Header -->
    <header class="pt-8 pb-4 px-6 text-center text-white">
        <span class="inline-block px-4 py-1 mb-3 text-xs font-extrabold tracking-widest uppercase bg-white/20 rounded-full border border-white/30 backdrop-blur-md">
            ⚡ Энергияны қосамыз! ⚡
        </span>
        <h1 class="serif-title text-3xl md:text-5xl font-extrabold tracking-tight drop-shadow-md">
            Абайша <span class="text-amber-300">Сергіту Сәті</span>
        </h1>
        <p class="text-sm md:text-base text-purple-100 max-w-md mx-auto mt-2 font-light">
            Миды тынықтырып, бойды сергітетін жылдам әрі көңілді ойын!
        </p>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto px-6 flex-1 flex flex-col justify-center my-4">
        
        <div class="glass-card rounded-3xl p-6 md:p-8 shadow-2xl text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-amber-400 via-rose-500 to-purple-600"></div>

            <!-- Icon/Emoji -->
            <div id="taskEmoji" class="text-6xl mb-4 animate-bounce-slow">🎯</div>

            <!-- Task Category -->
            <span id="taskCategory" class="text-xs font-bold uppercase tracking-wider text-rose-600 bg-rose-100 px-3 py-1 rounded-full">
                Дайынсыз ба?
            </span>

            <!-- Task Title / Text -->
            <h2 id="taskTitle" class="text-xl md:text-2xl font-bold mt-4 mb-2 text-slate-800">
                Батырманы басып, сергітуді бастайық!
            </h2>
            <p id="taskDesc" class="text-sm text-slate-600 mb-6 min-h-[48px] flex items-center justify-center">
                Кездейсоқ тапсырма шығады, бәріміз бірге орындаймыз.
            </p>

            <!-- Action Button -->
            <button onclick="spinTask()" class="w-full py-4 bg-gradient-to-r from-purple-600 to-rose-600 hover:from-purple-700 hover:to-rose-700 text-white font-extrabold rounded-2xl shadow-lg shadow-purple-500/30 text-base transition-all transform active:scale-95 cursor-pointer flex items-center justify-center gap-2">
                <span>Келесі сергіту!</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-purple-100 text-xs px-6">
        <p>✨ 17-ші қара сөз рухымен — Сергек ми, бекем сана! ✨</p>
    </footer>

    <!-- Script logic -->
    <script>
        const tasks = [
            {
                emoji: "🧘‍♂️",
                category: "Дене сергіту",
                title: "Терең тыныс алу",
                desc: "Барлығымыз орнымыздан түзу тұрып, қолды жоғары көтеріп терең дем аламыз... Шығарамыз! (3 рет)"
            },
            {
                emoji: "⚡",
                category: "Жылдамдық ойыны",
                title: "Абайдың 5 асылы",
                desc: "Қатардағы оқушы кез келген Абай атаған 1 асыл істі айтады (мысалы: Талап, Еңбек...)"
            },
            {
                emoji: "👏",
                category: "Энергия",
                title: "Ысқылау & Шапалақ",
                desc: "Алақандарыңызды қатты-қатты ысқылап, жылуын сезініп, лезде шапалақ ұрып жібереміз!"
            },
            {
                emoji: "🧠",
                category: "Миға шабуыл",
                title: "Жаман әдеттен бойды аулақ салу",
                desc: "Еріншектік пен өсекке 'Жоқ!' деп іс-қимылмен бәріміз бірге бас шайқаймыз!"
            },
            {
                emoji: "🦅",
                category: "Көңілді қозғалыс",
                title: "Қырандай серпіліс",
                desc: "Иықтарыңызды артқа қарай 5 рет айналдырып, мойынды сергітіп алыңыз."
            },
            {
                emoji: "💡",
                category: "Философиялық секунд",
                title: "Бүгінгі ұран",
                desc: "Бір ауыздан қайталаймыз: 'Талап, еңбек, терең ой — біздің басты мақсатымыз!'"
            }
        ];

        let lastIndex = -1;

        function spinTask() {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * tasks.length);
            } while (randomIndex === lastIndex);
            
            lastIndex = randomIndex;
            const current = tasks[randomIndex];

            const card = document.querySelector('.glass-card');
            card.style.transform = 'scale(0.96)';
            card.style.opacity = '0.7';

            setTimeout(() => {
                document.getElementById('taskEmoji').textContent = current.emoji;
                document.getElementById('taskCategory').textContent = current.category;
                document.getElementById('taskTitle').textContent = current.title;
                document.getElementById('taskDesc').textContent = current.desc;

                card.style.transform = 'scale(1)';
                card.style.opacity = '1';
            }, 150);
        }
    </script>
</body>
</html>
