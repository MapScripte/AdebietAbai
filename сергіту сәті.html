<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Үй тапсырмасы: Менің таңдауым – Ақыл, Қайрат, Жүрек бірлігі</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .animate-float { animation: float 4s ease-in-out infinite; }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-teal-50 to-indigo-50 min-h-screen text-slate-800 flex flex-col items-center justify-center p-4 sm:p-6">

    <div class="max-w-2xl w-full mx-auto space-y-6">
        
        <!-- Header Badge -->
        <div class="text-center space-y-2">
            <span class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-teal-500/10 text-teal-700 font-semibold text-sm shadow-sm">
                <i data-lucide="book-open" class="w-4 h-4"></i> Үйге тапсырма
            </span>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-slate-900 bg-gradient-to-r from-teal-600 via-indigo-600 to-amber-600 bg-clip-text text-transparent">
                Ақыл, Қайрат, Жүрек бірлігі
            </h1>
        </div>

        <!-- Main Task Card with Wow Effect & Animation -->
        <div class="glass-card rounded-3xl p-6 sm:p-8 shadow-xl shadow-teal-900/5 relative overflow-hidden transition-all duration-300 hover:shadow-2xl animate-float">
            
            <!-- Decorative background blur circles -->
            <div class="absolute -top-12 -right-12 w-32 h-32 bg-teal-400/20 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-12 -left-12 w-32 h-32 bg-amber-400/20 rounded-full blur-2xl pointer-events-none"></div>

            <div class="relative z-10 space-y-6">
                
                <!-- Topic Display -->
                <div class="flex items-start gap-4 p-4 rounded-2xl bg-white/60 border border-white shadow-sm">
                    <div class="p-3 rounded-xl bg-teal-500 text-white shadow-md shadow-teal-500/20 shrink-0">
                        <i data-lucide="pen-tool" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h2 class="text-xs font-bold uppercase tracking-wider text-teal-600 mb-1">Тақырып</h2>
                        <p class="text-lg sm:text-xl font-bold text-slate-900">
                            «Менің таңдауым – Ақыл, Қайрат, Жүрек бірлігі»
                        </p>
                    </div>
                </div>

                <!-- Requirements Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="flex items-center gap-3 p-3.5 rounded-2xl bg-indigo-50/50 border border-indigo-100/50">
                        <div class="p-2 rounded-lg bg-indigo-500 text-indigo-50">
                            <i data-lucide="file-text" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500 font-medium">Жанр түрі</p>
                            <p class="text-sm font-bold text-indigo-950">Шағын эссе</p>
                        </div>
                    </div>

                    <div class="flex items-center gap-3 p-3.5 rounded-2xl bg-amber-50/50 border border-amber-100/50">
                        <div class="p-2 rounded-lg bg-amber-500 text-amber-50">
                            <i data-lucide="list-ordered" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <p class="text-xs text-slate-500 font-medium">Көлемі</p>
                            <p class="text-sm font-bold text-amber-950">80–100 сөз</p>
                        </div>
                    </div>
                </div>

                <!-- Interactive Essay Draft Box -->
                <div class="space-y-2 pt-2">
                    <div class="flex justify-between items-center text-xs font-semibold text-slate-600 px-1">
                        <span>Эссе жобасын жазу өрісі:</span>
                        <span id="wordCount" class="text-teal-600 bg-teal-50 px-2 py-0.5 rounded-md font-bold">0 сөз</span>
                    </div>
                    <textarea id="essayInput" rows="4" 
                        class="w-full p-4 rounded-2xl bg-white/80 border border-slate-200 focus:border-teal-500 focus:ring-2 focus:ring-teal-500/20 outline-none transition-all text-slate-700 placeholder:text-slate-400 text-sm shadow-inner"
                        placeholder="Осында эссеңізді жазыңыз (80–100 сөз)..."></textarea>
                </div>

                <!-- Action Button -->
                <button onclick="checkWords()" class="w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-teal-500 via-indigo-600 to-amber-500 text-white font-bold shadow-lg shadow-teal-500/25 hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-2 cursor-pointer">
                    <i data-lucide="check-circle-2" class="w-5 h-5"></i> Тапсырманы тексеру
                </button>

            </div>
        </div>

        <!-- Footer Note -->
        <p class="text-center text-xs text-slate-500 font-medium">
            Абай Құнанбайұлының қара сөздері негізінде жасалған тапсырма.
        </p>

    </div>

    <!-- Script to count words -->
    <script>
        lucide.createIcons();
        
        const textarea = document.getElementById('essayInput');
        const wordCountDisplay = document.getElementById('wordCount');

        textarea.addEventListener('input', () => {
            const text = textarea.value.trim();
            const words = text === '' ? [] : text.split(/\s+/);
            const count = words.length;
            wordCountDisplay.textContent = `${count} сөз`;
            
            if (count >= 80 && count <= 100) {
                wordCountDisplay.className = "text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md font-bold transition-all";
            } else {
                wordCountDisplay.className = "text-teal-600 bg-teal-50 px-2 py-0.5 rounded-md font-bold transition-all";
            }
        });

        function checkWords() {
            const text = textarea.value.trim();
            const count = text === '' ? 0 : text.split(/\s+/).length;
            if (count >= 80 && count <= 100) {
                alert(`Тамаша! Эссе көлемі талапқа сай (${count} сөз).`);
            } else {
                alert(`Эссе көлемі 80–100 сөз аралығында болуы тиіс. Қазіргі көлемі: ${count} сөз.`);
            }
        }
    </script>
</body>
</html>
